name: ttraining_record
description: "A new Flutter project."
publish_to: 'none'

# Flutter Intl（多言語化）
flutter_intl:
  enabled: true
  main_locale: kl

# バージョン

version: 1.3.14+66

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  flutter_native_timezone: ^2.0.0
  shared_preferences: ^2.3.2
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  # UI / グラフ
  fl_chart: ^0.68.0
  # 広告
  google_mobile_ads: ^6.0.0
  app_tracking_transparency: ^2.0.4
  image_picker: ^1.0.7
  path_provider: ^2.1.3
  # UI コンポーネント
  numberpicker: ^2.1.2
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2
  # データ/永続化
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # i18n
  intl: ^0.20.2
  # パッケージ名変更ツール
  change_app_package_name: ^1.5.0
  # その他
  collection: any
  permission_handler: ^11.3.1
  camera: ^0.11.0
  share_plus: ^7.2.1
  google_fonts: ^6.2.1
  home_widget: ^0.8.0
  wakelock_plus: ^1.4.0
  in_app_review: ^2.0.11
  device_calendar_plus: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # コード生成とリンティング
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  # ランチャーアイコン生成
  flutter_launcher_icons: ^0.14.4

# ---- ランチャーアイコン設定 ----
flutter_launcher_icons:
  android: true
  ios: true

  # iOS 用（背景白 1024px アイコン）
  image_path: assets/app_icons/icon_ios_1024.png
  remove_alpha_ios: true   # 透過は不可なので白で塗りつぶし

  # Android 用（余白ゼロ、背景グレー #B3B8BC）
  adaptive_icon_foreground: assets/app_icons/icon_foreground.png
  adaptive_icon_background: assets/app_icons/icon_background.png
  adaptive_icon_monochrome: assets/app_icons/icon_monochrome.png


# Flutter 本体設定
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/app_icons/
    - assets/sounds/pipi4_880_fast.m4a
    - assets/calendar/
    - assets/graph/
    - assets/album/
